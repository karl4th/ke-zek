[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kezek"
version = "0.0.1"
description = "Fast speaker diarization for podcasts on Mimi latents, with the KezekBench duplex benchmark"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bagzhan Karl" }]
requires-python = ">=3.10"
keywords = ["speaker diarization", "voice activity detection", "speech", "benchmark", "full-duplex"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Reference systems for K0. Installed separately: they pull in torch and model weights.
baselines = [
    "pyannote.audio>=3.1",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/karl4th/ke-zek"

[project.scripts]
kezek = "kezek.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kezek"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
